<html lang="en">
    <head>
        <link href="style.css" rel="stylesheet preload"/>
        <meta charset="UTF-8" />
        <title>test</title>
        <style>
            body {background-image: url(images/ONETWO12.gif);}
            @keyframes rotatesideish {
                0% {transform: translate(-50%, -50%) rotate(30deg);}
                25% {transform: translate(-50%, -50%) rotate(-30deg);}
                50% {transform: translate(-50%, -50%) rotate(30deg);}
                75% {transform: translate(-50%, -50%) rotate(-30deg);}
                100% {transform: translate(-50%, -50%) rotate(30deg);}
            }
            
            @keyframes rotateside {
                0% {transform: translate(-50%, -50%) rotate(-30deg);}
                25% {transform: translate(-50%, -50%) rotate(30deg);}
                50% {transform: translate(-50%, -50%) rotate(-30deg);}
                75% {transform: translate(-50%, -50%) rotate(30deg);}
                100% {transform: translate(-50%, -50%) rotate(-30deg);}
            }
            
            @keyframes rotate {
                0% {transform: translate(-50%, -50%) rotate(0deg);}
                25% {transform: translate(-50%, -50%) rotate(90deg);}
                50% {transform: translate(-50%, -50%) rotate(180deg);}
                75% {transform: translate(-50%, -50%) rotate(270deg);}
                100% {transform: translate(-50%, -50%) rotate(360deg);}
            }
            
            #fadeout {
                position: fixed;
                inset: 0;
                background-color: #8f8e8c;
                opacity: 1;
                z-index: 0;
            }
            
            .fade {
                animation: fade 2s forwards;
            }
            
            .unfade {
                animation: unfade 1s forwards;
            }
            
            @keyframes fade { 
                from { opacity: 1; }
                to { opacity: 0; }
            }    
            
            @keyframes unfade {
                from { opacity: 0; }
                to { opacity: 1; }
            }   
            
            .rotating {
                animation: rotate 3.4782s infinite;
                animation-timing-function: cubic-bezier(0.19, 1, 0.22, 1);
            }
            
            .rotating-side {
                animation: rotateside 3.4782s infinite;
                animation-timing-function: cubic-bezier(0.1, 1, 0.1, 1);
            }
            
            .rotating-sideish {
                animation: rotatesideish 3.4782s infinite;
                animation-timing-function: cubic-bezier(0.1, 1, 0.1, 1);
            }
            
        </style>
    </head>
    <body>
        <div style="background-color: white; position: absolute; width: 110%; height: 20vh; top: 40.5vh; left: -10px; z-index: -1;" ></div>
        <div id="fadeout" class="" style="background-color: 8f8e8c; width: 100%; height: 100%; opacity: 1;"></div>
        <audio id="music" src="audio/Pilotredsky-AlongWithBrew.flac"></audio>
        <img id="test1" class="no" src="images/d_o_o_l_f13b.webp" onclick="animation()" style="position: absolute; top: 50vh; left: 68vh; width: 20vh; translate: none; z-index: -1;">
        <img id="test5" class="no" src="images/d_o_o_l_f13b.webp" onclick="animation()" style="position: absolute; top: 50vh; left: 41vh; width: 20vh; translate: none; z-index: -1;">
        <img id="test6" class="no" src="images/d_o_o_l_f13b.webp" onclick="animation()" style="position: absolute; top: 50vh; left: 16vh; width: 20vh; translate: none; z-index: -1;">
        <img id="test" class="no" src="images/d_o_o_l_f13b.webp" onclick="animation()" style="position: absolute; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50vh;">
        <img id="test2" class="no" src="images/d_o_o_l_f13b.webp" onclick="animation()" style="position: absolute; top: 50vh; right: 48vh; width: 20vh; translate: none; z-index: -1;">
        <img id="test3" class="no" src="images/d_o_o_l_f13b.webp" onclick="animation()" style="position: absolute; top: 50vh; right: 21vh; width: 20vh; translate: none; z-index: -1;">
        <img id="test4" class="no" src="images/d_o_o_l_f13b.webp" onclick="animation()" style="position: absolute; top: 50vh; right: -6vh; width: 20vh; translate: none; z-index: -1;">

    <script>
        const music = document.getElementById("music");
        
        function animation() {
            if (document.getElementById("test").className != "rotating"){
                music.play();
                document.getElementById("test").className = "rotating";
                document.getElementById("test1").className = "rotating-side";
                document.getElementById("test2").className = "rotating-sideish";
                document.getElementById("test3").className = "rotating-side";
                document.getElementById("test4").className = "rotating-sideish";
                document.getElementById("test5").className = "rotating-sideish";
                document.getElementById("test6").className = "rotating-side";

            } else {
                document.getElementById("test").className="no";
                document.getElementById("test1").className = "no";
                document.getElementById("test2").className = "no";
                document.getElementById("test3").className = "no";
                document.getElementById("test4").className = "no";
                document.getElementById("test5").className = "no";
                document.getElementById("test6").className = "no";
                music.pause();
                music.currentTime = 0;
            }
        }
        
        music.addEventListener("timeupdate", function() {
        if (music.currentTime >= 55) {
            document.getElementById("fadeout").className="fade";
            }
        else if (music.currentTime == 0) {
            document.getElementById("fadeout").className="unfade";
            }
        });
    </script>
    </body>
</html>
